# AutoTag GUI configuration (Perl syntax).
# Installed as /etc/autotag-gui.conf - must be owned by root and not writable by others,
# because the helper reads it while running as the BIGSdb user.
{
	# BIGSdb autotagger script.
	autotag_script => '/opt/BIGSdb-v_1.51.4/scripts/automation/autotag.pl',

	# User that runs autotag.pl (the helper is started as this user through sudo).
	run_as => 'bigsdb',

	# Privileged helper that starts/stops jobs.
	helper => '/opt/autotag-gui/bin/autotag-gui-helper',

	# Where job folders (settings, output, progress) are kept. Not web accessible.
	jobs_dir => '/var/lib/autotag-gui/jobs',

	# Maximum number of tagging sessions running at the same time.
	max_running => 3,

	# Number of finished jobs to keep; older ones are removed when a new job starts.
	keep_finished => 50,

	# Safety limits on input.
	max_isolates => 50_000,

	# Databases that can be selected (name = BIGSdb database configuration).
	databases => [
		{ name => 'ecoli_isolates',            label => 'Escherichia coli' },
		{ name => 'kleb_sensu_lato__isolates', label => 'Klebsiella sensu lato' },
		{ name => 'enterobacter_isolates',     label => 'Enterobacter' },
		{ name => 'entfae_isolates',           label => 'Enterococcus faecalis' },
	],

	# Schemes offered as checkboxes; 'default' ones are ticked when the page loads.
	schemes => [
		{ id => 1, label => 'Scheme 1', default => 1 },
		{ id => 2, label => 'Scheme 2', default => 1 },
	],

	# Extra arguments always passed to autotag.pl, e.g. [ '--fast' ].
	extra_args => [],
}
