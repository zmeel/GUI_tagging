# AutoTag GUI - installed as /etc/apache2/conf-available/autotag-gui.conf
# Enable with:  a2enmod cgi && a2enconf autotag-gui && systemctl reload apache2

<Directory /var/www/html/autotag>
    Options -Indexes +ExecCGI
    AddHandler cgi-script .cgi
    DirectoryIndex index.html

    # Anyone who can open this page can write allele designations to your
    # databases, and the BIGSdb login does NOT cover this folder.
    # Create users with:  htpasswd -c /etc/apache2/autotag-gui.htpasswd USERNAME
    # (leave out -c when adding more users).
    AuthType Basic
    AuthName "BIGSdb AutoTag"
    AuthUserFile /etc/apache2/autotag-gui.htpasswd
    Require valid-user
</Directory>
